# Alembic configuration file for Phase 3 database migrations

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path - for relative imports
prepend_sys_path = .

# Version location specification
version_locations = %(here)s/alembic/versions

# Timezone for revision timestamps
timezone =

# Max number of revisions to display
truncate_slug_length = 40

# Set to 'true' to run rev_id generation in reverse chronological order
rev_id = %(down_revision)s

# Hook for programmatically configuring logging
# See python logging module documentation for more info
# pythonpath = .

[post_write_hooks]
# Hooks for code formatters
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = --line-length 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
