apiVersion: v2
name: todo-app
description: A Helm umbrella chart for the Todo AI Chatbot application
type: application
version: 0.1.0
appVersion: "1.0.0"

keywords:
  - todo
  - ai
  - chatbot
  - fastapi
  - nextjs

maintainers:
  - name: Todo Team
    email: team@example.com

dependencies:
  - name: backend
    version: 0.1.0
    repository: file://./charts/backend
    condition: backend.enabled
  - name: frontend
    version: 0.1.0
    repository: file://./charts/frontend
    condition: frontend.enabled
  - name: postgresql
    version: 0.1.0
    repository: file://./charts/postgresql
    condition: postgresql.enabled
