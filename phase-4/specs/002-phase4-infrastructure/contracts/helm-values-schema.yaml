# Helm Values JSON Schema
# This schema defines the structure for values.yaml in the todo-app Helm chart

$schema: "http://json-schema.org/draft-07/schema#"
title: Todo App Helm Values
description: Configuration values for the Todo AI Chatbot Kubernetes deployment
type: object

properties:
  global:
    type: object
    description: Global settings applied to all subcharts
    properties:
      namespace:
        type: string
        description: Kubernetes namespace for deployment
        default: todo-app
      imagePullPolicy:
        type: string
        enum: [Always, IfNotPresent, Never]
        default: IfNotPresent
    required:
      - namespace

  backend:
    type: object
    description: Backend (FastAPI) configuration
    properties:
      enabled:
        type: boolean
        default: true
      replicaCount:
        type: integer
        minimum: 1
        maximum: 10
        default: 2
      image:
        type: object
        properties:
          repository:
            type: string
            default: todo-backend
          tag:
            type: string
            default: latest
        required:
          - repository
          - tag
      resources:
        type: object
        properties:
          requests:
            type: object
            properties:
              cpu:
                type: string
                pattern: "^[0-9]+m?$"
                default: "100m"
              memory:
                type: string
                pattern: "^[0-9]+(Mi|Gi)$"
                default: "256Mi"
          limits:
            type: object
            properties:
              cpu:
                type: string
                default: "500m"
              memory:
                type: string
                default: "512Mi"
      probes:
        type: object
        properties:
          liveness:
            type: object
            properties:
              path:
                type: string
                default: /health
              initialDelaySeconds:
                type: integer
                default: 30
              periodSeconds:
                type: integer
                default: 10
          readiness:
            type: object
            properties:
              path:
                type: string
                default: /health
              initialDelaySeconds:
                type: integer
                default: 10
              periodSeconds:
                type: integer
                default: 5
      autoscaling:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
          minReplicas:
            type: integer
            minimum: 1
            default: 1
          maxReplicas:
            type: integer
            maximum: 10
            default: 5
          targetCPU:
            type: integer
            minimum: 50
            maximum: 90
            default: 70
      env:
        type: object
        description: Environment variables (non-sensitive)
        additionalProperties:
          type: string
      secretRef:
        type: string
        description: Reference to Kubernetes Secret for sensitive env vars
        default: backend-secrets

  frontend:
    type: object
    description: Frontend (Next.js) configuration
    properties:
      enabled:
        type: boolean
        default: true
      replicaCount:
        type: integer
        minimum: 1
        maximum: 10
        default: 2
      image:
        type: object
        properties:
          repository:
            type: string
            default: todo-frontend
          tag:
            type: string
            default: latest
      resources:
        type: object
        properties:
          requests:
            type: object
            properties:
              cpu:
                type: string
                default: "50m"
              memory:
                type: string
                default: "128Mi"
          limits:
            type: object
            properties:
              cpu:
                type: string
                default: "200m"
              memory:
                type: string
                default: "256Mi"
      ingress:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
          className:
            type: string
            default: nginx
          host:
            type: string
            default: todo.local
          tls:
            type: boolean
            default: false

  postgresql:
    type: object
    description: PostgreSQL database configuration
    properties:
      enabled:
        type: boolean
        default: true
        description: Set to false to use external database
      persistence:
        type: object
        properties:
          enabled:
            type: boolean
            default: true
          size:
            type: string
            pattern: "^[0-9]+(Mi|Gi)$"
            default: "10Gi"
          storageClass:
            type: string
            default: standard
      auth:
        type: object
        properties:
          username:
            type: string
            default: postgres
          database:
            type: string
            default: todo_app
          existingSecret:
            type: string
            description: Reference to secret containing password
            default: postgres-secrets
      resources:
        type: object
        properties:
          requests:
            type: object
            properties:
              cpu:
                type: string
                default: "100m"
              memory:
                type: string
                default: "256Mi"
          limits:
            type: object
            properties:
              cpu:
                type: string
                default: "500m"
              memory:
                type: string
                default: "512Mi"

required:
  - global
  - backend
  - frontend
