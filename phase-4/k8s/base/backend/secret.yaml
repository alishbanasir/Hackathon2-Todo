# Backend Secrets Template
# Values should be replaced at deploy time using envsubst or sealed-secrets
# DO NOT commit actual secret values to version control
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  labels:
    app: todo-backend
    tier: api
type: Opaque
stringData:
  # Database connection string
  DATABASE_URL: "${DATABASE_URL}"
  # AI Integration (Groq - replaces Gemini)
  GROQ_API_KEY: "${GROQ_API_KEY}"
  # Google AI API key (deprecated, kept for reference)
  GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
  # Authentication secret
  BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
